# Profiles: `demo` runs the whole stack (default via COMPOSE_PROFILES in .env);
# `dev` runs only the infrastructure so the api and worker can run on the host.
name: tramo

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
    # The application plus the seed and demo scripts; the default target leaves them out.
    target: demo
  # Named after the project, so copies run with `-p` do not overwrite each other's image.
  image: ${COMPOSE_PROJECT_NAME}:local
  profiles: [demo]
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment: &app-env # A local stack: production mode refuses the development secrets used below.
    NODE_ENV: development
    LOG_LEVEL: ${LOG_LEVEL:-info}
    LOG_PRETTY: 'false'
    PORT: 3000
    WORKER_HEALTH_PORT: 3100
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    SWAGGER_ENABLED: 'true'
    DATABASE_URL: postgres://${POSTGRES_USER:-tramo}:${POSTGRES_PASSWORD:-tramo}@postgres:5432/${POSTGRES_DB:-tramo}
    DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
    REDIS_URL: redis://redis:6379
    JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-development-secret-change-me-0123456789}
    # VAT checks answered locally, so the stack works offline; VIES_MODE=test asks the real VIES
    # test service (internet needed).
    VIES_MODE: ${VIES_MODE:-fake}
    FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-K0ZDSqr9YOcVMSLG1k4+T3Ie9/nmSDRZDMoifZ6VyIU=}
    ESIGN_WEBHOOK_SECRET: ${ESIGN_WEBHOOK_SECRET:-local-esign-webhook-secret-change-me-0123456789}
    PSP_WEBHOOK_SECRET: ${PSP_WEBHOOK_SECRET:-local-psp-webhook-secret-change-me-0123456789}
    # The worker reaches the api by its service name, whatever .env says for local runs.
    PSP_CALLBACK_URL: http://api:3000
    # Emails to Mailpit (UI on :8025), and webhooks to the sink by its service name.
    SMTP_HOST: mailpit
    SMTP_PORT: 1025
    EMAIL_FROM: ${EMAIL_FROM:-Tramo <no-reply@tramo.test>}
    WEBHOOK_RETRY_DELAY_MS: ${WEBHOOK_RETRY_DELAY_MS:-30000}
    BULL_BOARD_USERNAME: ${BULL_BOARD_USERNAME:-ops}
    # Default only when unset; an empty value in .env disables the dashboard.
    BULL_BOARD_PASSWORD: ${BULL_BOARD_PASSWORD-tramo-queues}
    METRICS_TOKEN: ${METRICS_TOKEN-tramo-local-metrics-token-change-me}
    # Read only by the demo script when it runs inside the api container.
    MAILPIT_URL: http://mailpit:8025
    WEBHOOK_SINK_URL: http://webhook-sink:9099

services:
  postgres:
    build:
      context: docker/postgres
    image: ${COMPOSE_PROJECT_NAME}-postgres:local
    profiles: [dev, demo]
    restart: unless-stopped
    # pg_stat_statements must be preloaded; it feeds the query diagnostics (see .mcp.json).
    command: ['postgres', '-c', 'shared_preload_libraries=pg_stat_statements']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tramo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tramo}
      POSTGRES_DB: ${POSTGRES_DB:-tramo}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/postgres/diagnostics.sql:/docker-entrypoint-initdb.d/02-diagnostics.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.11-alpine
    profiles: [dev, demo]
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.4
    profiles: [dev, demo]
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'

  webhook-sink:
    image: node:24.19.0-alpine
    profiles: [dev, demo]
    restart: unless-stopped
    command: ['node', '/srv/server.mjs']
    environment:
      PORT: 9099
    ports:
      - '127.0.0.1:${WEBHOOK_SINK_PORT:-9099}:9099'
    volumes:
      - ./docker/webhook-sink/server.mjs:/srv/server.mjs:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:9099/health']
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    <<: *app
    environment:
      <<: *app-env
      # Only the api migrates; replicas take turns through a Postgres advisory lock.
      DATABASE_RUN_MIGRATIONS: 'true'
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  worker:
    <<: *app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The api applies migrations; the worker reads the outbox, so it waits for them.
      api:
        condition: service_healthy
    command: ['node', '--enable-source-maps', 'dist/src/main.worker.js']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3100/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  # Loads the demo data set (scripts/seed.ts) once the api has migrated the database, then exits.
  # Idempotent: every `up` runs it again and it leaves what exists alone.
  seed:
    <<: *app
    restart: 'no'
    depends_on:
      api:
        condition: service_healthy
    command: ['node', '--enable-source-maps', 'dist/scripts/seed.js']

volumes:
  pgdata:
  redisdata:
